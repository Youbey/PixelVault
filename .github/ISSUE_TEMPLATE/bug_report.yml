name: Bug report
description: Report a reproducible bug
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: Steps to reproduce, expected vs actual
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: Browser + version, OS, PixelVault commit/URL
    validations:
      required: true
